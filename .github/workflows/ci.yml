name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      DATABASE_URL: file:./data/ci.db
      MAIL_SINK_DIR: ./data/ci-mail
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-0123456789
      BETTER_AUTH_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm db:generate
      - run: pnpm content:validate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
        env:
          BETTER_AUTH_SECRET: ci-only-secret-not-for-production-0123456789
      - run: docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml config -q
        env:
          BETTER_AUTH_SECRET: ci-only-secret-not-for-production-0123456789
          DOMAIN: study.example.org
      # Builds the images, starts the stack, and proves the app serves and can write to its database.
      - run: bash scripts/docker-smoke.sh
