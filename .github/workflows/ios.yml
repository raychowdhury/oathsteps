name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", "content/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "content/**", ".github/workflows/ios.yml"]

permissions:
  contents: read

jobs:
  ios:
    # Swift 6.2 language features (default main-actor isolation, nonisolated types) need Xcode 26 or later.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Core logic tests (Swift Testing)
        working-directory: ios/OathStepsCore
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and run the UI tests on a simulator
        run: ios/test-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ui-results
          path: ios/build/ui.xcresult
          retention-days: 14
