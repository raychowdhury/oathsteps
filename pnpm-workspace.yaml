# pnpm 10 only runs install scripts for packages listed here. better-sqlite3 needs its native build;
# Prisma downloads engines. sharp and unrs-resolver work without their optional builds.
onlyBuiltDependencies:
  - better-sqlite3
  - "@prisma/engines"
  - prisma
  - esbuild
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
# Security overrides for transitive dependencies with published advisories (pnpm audit --prod).
# mysql2 is better-auth's optional MySQL adapter (unused here); deepmerge-ts is Prisma's config loader.
overrides:
  mysql2: ">=3.23.1"
  deepmerge-ts: ">=8.0.0"
